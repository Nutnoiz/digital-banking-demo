name: Self-hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    name: Test Self-hosted Runner
    runs-on: [self-hosted, docker-desktop-test]

    steps:
      - name: Test Runner
        shell: powershell
        run: |
          Write-Host "Self-hosted runner test started"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $kubeconfig = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "kubectl path: $kubectl"
          Write-Host "kubectl exists: $(Test-Path $kubectl)"

          Write-Host "kubeconfig path: $kubeconfig"
          Write-Host "kubeconfig exists: $(Test-Path $kubeconfig)"

          $env:KUBECONFIG = $kubeconfig

          & $kubectl version --client

          Write-Host "Current Kubernetes context:"
          & $kubectl config current-context

          Write-Host "Kubernetes nodes:"
          & $kubectl get nodes

