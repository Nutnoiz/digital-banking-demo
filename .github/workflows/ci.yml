name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/digital-banking-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test Backend
        run: ./mvnw clean verify

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend/digital-banking-api
          push: true
          tags: |
            ghcr.io/nutnoiz/digital-banking-api:latest
            ghcr.io/nutnoiz/digital-banking-api:${{ github.sha }}

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/digital-banking-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/digital-banking-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: frontend/digital-banking-web
          push: true
          tags: |
            ghcr.io/nutnoiz/digital-banking-web:latest
            ghcr.io/nutnoiz/digital-banking-web:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, docker-desktop-test]

    permissions:
      contents: read

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify Kubernetes Context
        shell: powershell
        run: |
          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $kubeconfig = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $env:KUBECONFIG = $kubeconfig

          Write-Host "========================================"
          Write-Host "KUBERNETES CONTEXT VERIFICATION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Runner: $env:RUNNER_NAME"

          Write-Host ""
          Write-Host "Kubernetes context:"
          & $kubectl config current-context

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read Kubernetes context."
          }

          Write-Host ""
          Write-Host "Kubernetes nodes:"
          & $kubectl get nodes

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to access Kubernetes cluster."
          }

          Write-Host ""
          Write-Host "Kubernetes context verification: PASS"

      - name: Capture Current Deployment Images
        shell: powershell
        run: |
          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "========================================"
          Write-Host "CAPTURE CURRENT DEPLOYMENT IMAGES"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Reading current backend image..."

          $backendImage = (& $kubectl get deployment backend-deployment `
            -o jsonpath="{.spec.template.spec.containers[0].image}").Trim()

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($backendImage)) {
            throw "Failed to capture current backend image."
          }

          Write-Host "Current backend image:"
          Write-Host $backendImage

          Write-Host ""
          Write-Host "Reading current frontend image..."

          $frontendImage = (& $kubectl get deployment frontend-deployment `
            -o jsonpath="{.spec.template.spec.containers[0].image}").Trim()

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($frontendImage)) {
            throw "Failed to capture current frontend image."
          }

          Write-Host "Current frontend image:"
          Write-Host $frontendImage

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PREVIOUS_BACKEND_IMAGE=$backendImage"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PREVIOUS_FRONTEND_IMAGE=$frontendImage"

          Write-Host ""
          Write-Host "Previous deployment images captured: PASS"

      - name: Update Backend Image
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $image = "ghcr.io/nutnoiz/digital-banking-api:$env:GITHUB_SHA"
          $changeCause = "Git commit $env:GITHUB_SHA"

          Write-Host "========================================"
          Write-Host "BACKEND DEPLOYMENT"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Image: $image"
          Write-Host "Change cause: $changeCause"

          Write-Host ""
          Write-Host "Recording rollout change cause..."

          & $kubectl annotate deployment/backend-deployment `
            kubernetes.io/change-cause="$changeCause" `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to annotate backend deployment."
          }

          Write-Host "Change cause annotation: PASS"

          Write-Host ""
          Write-Host "Updating backend image..."

          & $kubectl set image deployment/backend-deployment `
            backend=$image

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update backend image."
          }

          Write-Host "Backend image update: PASS"

      - name: Update Frontend Image
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $image = "ghcr.io/nutnoiz/digital-banking-web:$env:GITHUB_SHA"
          $changeCause = "Git commit $env:GITHUB_SHA"

          Write-Host "========================================"
          Write-Host "FRONTEND DEPLOYMENT"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Image: $image"
          Write-Host "Change cause: $changeCause"

          Write-Host ""
          Write-Host "Recording rollout change cause..."

          & $kubectl annotate deployment/frontend-deployment `
            kubernetes.io/change-cause="$changeCause" `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to annotate frontend deployment."
          }

          Write-Host "Change cause annotation: PASS"

          Write-Host ""
          Write-Host "Updating frontend image..."

          & $kubectl set image deployment/frontend-deployment `
            frontend=$image

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update frontend image."
          }

          Write-Host "Frontend image update: PASS"

      - name: Wait for Backend Rollout
        shell: powershell
        run: |
          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "Waiting for backend rollout..."

          & $kubectl rollout status deployment/backend-deployment --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Backend rollout failed."
          }

          Write-Host "Backend rollout: PASS"

      - name: Wait for Frontend Rollout
        shell: powershell
        run: |
          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "Waiting for frontend rollout..."

          & $kubectl rollout status deployment/frontend-deployment --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend rollout failed."
          }

          Write-Host "Frontend rollout: PASS"

      - name: Verify Application Health
        shell: powershell
        run: |
          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "========================================"
          Write-Host "APPLICATION HEALTH VERIFICATION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Deployments:"
          & $kubectl get deployments

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get deployments."
          }

          Write-Host ""
          Write-Host "Pods:"
          & $kubectl get pods

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get pods."
          }

          Write-Host ""
          Write-Host "Services:"
          & $kubectl get services

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get services."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "IMAGE VERSION VERIFICATION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Expected commit SHA:"
          Write-Host "${{ github.sha }}"

          Write-Host ""
          Write-Host "Backend image:"
          $backendImage = (& $kubectl get deployment backend-deployment `
            -o jsonpath="{.spec.template.spec.containers[0].image}").Trim()

          Write-Host $backendImage

          if ($backendImage -ne "ghcr.io/nutnoiz/digital-banking-api:${{ github.sha }}") {
            throw "Backend image does not match GitHub commit SHA."
          }

          Write-Host "Backend image verification: PASS"

          Write-Host ""
          Write-Host "Frontend image:"
          $frontendImage = (& $kubectl get deployment frontend-deployment `
            -o jsonpath="{.spec.template.spec.containers[0].image}").Trim()

          Write-Host $frontendImage

          if ($frontendImage -ne "ghcr.io/nutnoiz/digital-banking-web:${{ github.sha }}") {
            throw "Frontend image does not match GitHub commit SHA."
          }

          Write-Host "Frontend image verification: PASS"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BACKEND HEALTH CHECK"
          Write-Host "========================================"

          $backendHealth = & $kubectl exec deployment/backend-deployment -- `
            wget -qO- http://127.0.0.1:8080/actuator/health

          if ($LASTEXITCODE -ne 0) {
            throw "Backend health endpoint request failed."
          }

          Write-Host "Backend response:"
          Write-Host $backendHealth

          if ($backendHealth -notmatch '"status":"UP"') {
            throw "Backend health status is not UP."
          }

          Write-Host "Backend health verification: PASS"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FRONTEND -> BACKEND HEALTH CHECK"
          Write-Host "========================================"

          $frontendHealth = & $kubectl exec deployment/frontend-deployment -- `
            wget -qO- http://127.0.0.1/api/health

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend -> Backend health request failed."
          }

          Write-Host "Frontend -> Backend response:"
          Write-Host $frontendHealth

          if ($frontendHealth -notmatch '"status":"UP"') {
            throw "Frontend -> Backend health status is not UP."
          }

          Write-Host "Frontend -> Backend verification: PASS"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "APPLICATION VERIFICATION: PASS"
          Write-Host "========================================"

      - name: Controlled Rollback Failure Test
        if: contains(github.event.head_commit.message, '[rollback-test]')
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "CONTROLLED ROLLBACK FAILURE TEST"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Rollback test marker detected:"
          Write-Host "[rollback-test]"

          Write-Host ""
          Write-Host "Intentionally failing this step."
          Write-Host "Automatic rollback must execute next."

          throw "INTENTIONAL FAILURE FOR AUTOMATIC ROLLBACK TEST"

      - name: Automatic Rollback
        if: failure() || contains(github.event.head_commit.message, '[rollback-test]')
        shell: powershell
        run: |
          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "========================================"
          Write-Host "AUTOMATIC ROLLBACK"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Deployment verification failed."
          Write-Host "Restoring previous deployment images..."

          Write-Host ""
          Write-Host "Previous backend image:"
          Write-Host $env:PREVIOUS_BACKEND_IMAGE

          Write-Host ""
          Write-Host "Previous frontend image:"
          Write-Host $env:PREVIOUS_FRONTEND_IMAGE

          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_BACKEND_IMAGE)) {
            throw "Previous backend image is not available."
          }

          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_FRONTEND_IMAGE)) {
            throw "Previous frontend image is not available."
          }

          Write-Host ""
          Write-Host "Restoring backend image..."

          & $kubectl set image deployment/backend-deployment `
            backend=$env:PREVIOUS_BACKEND_IMAGE

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to restore backend image."
          }

          Write-Host "Backend image restore: PASS"

          Write-Host ""
          Write-Host "Restoring frontend image..."

          & $kubectl set image deployment/frontend-deployment `
            frontend=$env:PREVIOUS_FRONTEND_IMAGE

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to restore frontend image."
          }

          Write-Host "Frontend image restore: PASS"

          Write-Host ""
          Write-Host "Waiting for backend rollback..."

          & $kubectl rollout status deployment/backend-deployment --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Backend rollback rollout failed."
          }

          Write-Host "Backend rollback rollout: PASS"

          Write-Host ""
          Write-Host "Waiting for frontend rollback..."

          & $kubectl rollout status deployment/frontend-deployment --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend rollback rollout failed."
          }

          Write-Host "Frontend rollback rollout: PASS"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ROLLBACK HEALTH VERIFICATION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Backend health after rollback:"

          $backendHealth = & $kubectl exec deployment/backend-deployment -- `
            wget -qO- http://127.0.0.1:8080/actuator/health

          if ($LASTEXITCODE -ne 0) {
            throw "Backend rollback health request failed."
          }

          Write-Host $backendHealth

          if ($backendHealth -notmatch '"status":"UP"') {
            throw "Backend health is not UP after rollback."
          }

          Write-Host "Backend rollback health: PASS"

          Write-Host ""
          Write-Host "Frontend -> Backend health after rollback:"

          $frontendHealth = & $kubectl exec deployment/frontend-deployment -- `
            wget -qO- http://127.0.0.1/api/health

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend -> Backend rollback health request failed."
          }

          Write-Host $frontendHealth

          if ($frontendHealth -notmatch '"status":"UP"') {
            throw "Frontend -> Backend health is not UP after rollback."
          }

          Write-Host "Frontend -> Backend rollback health: PASS"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "AUTOMATIC ROLLBACK: PASS"
          Write-Host "========================================"

