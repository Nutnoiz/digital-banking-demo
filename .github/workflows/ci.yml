name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write


# ==============================================================
# WORKFLOW CONCURRENCY
# ==============================================================

concurrency:
  group: digital-banking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ============================================================
  # BACKEND CI
  # ============================================================

  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/digital-banking-api

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Build and Test Backend
        run: ./mvnw clean verify


      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and Push Backend Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: backend/digital-banking-api
          push: true
          tags: |
            ghcr.io/nutnoiz/digital-banking-api:latest
            ghcr.io/nutnoiz/digital-banking-api:${{ github.sha }}


  # ============================================================
  # FRONTEND CI
  # ============================================================

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/digital-banking-web

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/digital-banking-web/package-lock.json


      - name: Install Dependencies
        run: npm ci


      - name: Build Frontend
        run: npm run build


      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and Push Frontend Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: frontend/digital-banking-web
          push: true
          tags: |
            ghcr.io/nutnoiz/digital-banking-web:latest
            ghcr.io/nutnoiz/digital-banking-web:${{ github.sha }}


  # ============================================================
  # DEPLOY DEVELOPMENT
  # ============================================================

  deploy-dev:
    name: Deploy Development

    runs-on:
      - self-hosted
      - docker-desktop-test

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: development

    concurrency:
      group: digital-banking-development
      cancel-in-progress: false

    permissions:
      contents: read

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # KUBERNETES CONTEXT
      # ========================================================

      - name: Verify Kubernetes Context
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "========================================"
          Write-Host "KUBERNETES CONTEXT VERIFICATION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Runner: $env:RUNNER_NAME"

          Write-Host ""
          Write-Host "Kubernetes context:"

          & $kubectl config current-context

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read Kubernetes context."
          }

          Write-Host ""
          Write-Host "Kubernetes nodes:"

          & $kubectl get nodes

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to access Kubernetes cluster."
          }

          Write-Host ""
          Write-Host "Kubernetes context verification: PASS"


      # ========================================================
      # KUSTOMIZE VERIFICATION
      # ========================================================

      - name: Verify Kustomize Overlays
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "========================================"
          Write-Host "KUSTOMIZE OVERLAY VERIFICATION"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Checking Dev overlay..."

          & $kubectl kustomize .\k8s\overlays\dev | Out-Null

          if ($LASTEXITCODE -ne 0) {
            throw "Dev Kustomize overlay validation failed."
          }

          Write-Host "Dev Kustomize overlay: PASS"

          Write-Host ""
          Write-Host "Checking Prod overlay..."

          & $kubectl kustomize .\k8s\overlays\prod | Out-Null

          if ($LASTEXITCODE -ne 0) {
            throw "Prod Kustomize overlay validation failed."
          }

          Write-Host "Prod Kustomize overlay: PASS"


      # ========================================================
      # CAPTURE CURRENT DEV IMAGES
      # ========================================================

      - name: Capture Current Dev Images
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-dev"

          Write-Host "========================================"
          Write-Host "CAPTURE CURRENT DEV IMAGES"
          Write-Host "========================================"

          $backendImage = (
            & $kubectl get deployment backend-deployment `
              -n $namespace `
              -o jsonpath="{.spec.template.spec.containers[0].image}"
          ).Trim()

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($backendImage)) {
            throw "Failed to capture current Dev backend image."
          }

          $frontendImage = (
            & $kubectl get deployment frontend-deployment `
              -n $namespace `
              -o jsonpath="{.spec.template.spec.containers[0].image}"
          ).Trim()

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($frontendImage)) {
            throw "Failed to capture current Dev frontend image."
          }

          Write-Host ""
          Write-Host "Previous Dev backend:"
          Write-Host $backendImage

          Write-Host ""
          Write-Host "Previous Dev frontend:"
          Write-Host $frontendImage

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PREVIOUS_DEV_BACKEND_IMAGE=$backendImage"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PREVIOUS_DEV_FRONTEND_IMAGE=$frontendImage"

          Write-Host ""
          Write-Host "Previous Dev images captured: PASS"


      # ========================================================
      # CONFIGURE DEV IMAGES
      # ========================================================

      - name: Configure Dev Kustomize Images
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |

          $file = Join-Path `
            $env:GITHUB_WORKSPACE `
            "k8s\overlays\dev\kustomization.yml"

          $backendName = "ghcr.io/nutnoiz/digital-banking-api"
          $frontendName = "ghcr.io/nutnoiz/digital-banking-web"

          Write-Host "========================================"
          Write-Host "CONFIGURE DEV KUSTOMIZE IMAGES"
          Write-Host "========================================"

          if (-not (Test-Path $file)) {
            throw "Dev Kustomization file was not found."
          }

          $lines = [System.Collections.Generic.List[string]](
            [System.IO.File]::ReadAllLines($file)
          )

          if ($lines.Count -eq 0) {
            throw "Dev Kustomization file is empty."
          }

          $backendIndexes = @(
            0..($lines.Count - 1) |
            Where-Object {
              $lines[$_].Trim() -eq "- name: $backendName"
            }
          )

          if ($backendIndexes.Count -ne 1) {
            throw "Expected exactly one Dev backend image definition, found $($backendIndexes.Count)."
          }

          $backendIndex = $backendIndexes[0]

          if ($backendIndex + 1 -ge $lines.Count) {
            throw "Dev backend image definition has no following newTag line."
          }

          if ($lines[$backendIndex + 1].Trim() -notlike "newTag:*") {
            throw "Dev backend image definition is missing the expected newTag line."
          }

          $lines[$backendIndex + 1] = "    newTag: $env:GITHUB_SHA"


          $frontendIndexes = @(
            0..($lines.Count - 1) |
            Where-Object {
              $lines[$_].Trim() -eq "- name: $frontendName"
            }
          )

          if ($frontendIndexes.Count -ne 1) {
            throw "Expected exactly one Dev frontend image definition, found $($frontendIndexes.Count)."
          }

          $frontendIndex = $frontendIndexes[0]

          if ($frontendIndex + 1 -ge $lines.Count) {
            throw "Dev frontend image definition has no following newTag line."
          }

          if ($lines[$frontendIndex + 1].Trim() -notlike "newTag:*") {
            throw "Dev frontend image definition is missing the expected newTag line."
          }

          $lines[$frontendIndex + 1] = "    newTag: $env:GITHUB_SHA"


          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllLines(
            $file,
            $lines,
            $utf8NoBom
          )


          $updatedLines = [System.IO.File]::ReadAllLines($file)

          $updatedTags = @(
            $updatedLines |
            Where-Object {
              $_.Trim() -eq "newTag: $env:GITHUB_SHA"
            }
          )

          if ($updatedTags.Count -ne 2) {
            throw "Dev Kustomization must contain exactly two expected SHA tags."
          }


          $rendered = & "C:\Program Files\Kubernetes\kubectl.exe" `
            kustomize .\k8s\overlays\dev

          if ($LASTEXITCODE -ne 0) {
            throw "Dev Kustomize rendering failed."
          }

          $renderedText = $rendered -join "`n"

          $expectedBackend = "image: $backendName`:$env:GITHUB_SHA"
          $expectedFrontend = "image: $frontendName`:$env:GITHUB_SHA"

          if ($renderedText -notmatch [regex]::Escape($expectedBackend)) {
            throw "Rendered Dev backend image does not match Git SHA."
          }

          if ($renderedText -notmatch [regex]::Escape($expectedFrontend)) {
            throw "Rendered Dev frontend image does not match Git SHA."
          }

          Write-Host ""
          Write-Host "Dev backend image: PASS"
          Write-Host "Dev frontend image: PASS"
          Write-Host "Dev rendered image verification: PASS"


      # ========================================================
      # DEPLOY DEV
      # ========================================================

      - name: Deploy Dev with Kustomize
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-dev"
          $changeCause = "Git commit $env:GITHUB_SHA"

          Write-Host "========================================"
          Write-Host "DEPLOY DEV"
          Write-Host "========================================"

          & $kubectl apply -k .\k8s\overlays\dev

          if ($LASTEXITCODE -ne 0) {
            throw "Dev Kustomize deployment failed."
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "DEV_DEPLOY_STARTED=true"

          & $kubectl annotate `
            deployment/backend-deployment `
            -n $namespace `
            kubernetes.io/change-cause="$changeCause" `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to annotate Dev backend deployment."
          }

          & $kubectl annotate `
            deployment/frontend-deployment `
            -n $namespace `
            kubernetes.io/change-cause="$changeCause" `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to annotate Dev frontend deployment."
          }

          Write-Host "Dev deployment: PASS"


      # ========================================================
      # DEV ROLLOUT
      # ========================================================

      - name: Wait for Dev Rollout
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-dev"

          & $kubectl rollout status `
            deployment/backend-deployment `
            -n $namespace `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Dev backend rollout failed."
          }

          & $kubectl rollout status `
            deployment/frontend-deployment `
            -n $namespace `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Dev frontend rollout failed."
          }

          Write-Host "Dev rollout: PASS"


      # ========================================================
      # VERIFY DEV
      # ========================================================

      - name: Verify Dev Deployment
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-dev"

          $expectedBackend =
            "ghcr.io/nutnoiz/digital-banking-api:$env:GITHUB_SHA"

          $expectedFrontend =
            "ghcr.io/nutnoiz/digital-banking-web:$env:GITHUB_SHA"


          Write-Host "========================================"
          Write-Host "VERIFY DEV"
          Write-Host "========================================"


          & $kubectl get deployments -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get Dev deployments."
          }


          & $kubectl get pods -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get Dev pods."
          }


          & $kubectl get services -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get Dev services."
          }


          $backendImage = (
            & $kubectl get deployment backend-deployment `
              -n $namespace `
              -o jsonpath="{.spec.template.spec.containers[0].image}"
          ).Trim()

          if ($backendImage -ne $expectedBackend) {
            throw "Dev backend image does not match Git SHA."
          }

          Write-Host "Dev backend image: PASS"


          $frontendImage = (
            & $kubectl get deployment frontend-deployment `
              -n $namespace `
              -o jsonpath="{.spec.template.spec.containers[0].image}"
          ).Trim()

          if ($frontendImage -ne $expectedFrontend) {
            throw "Dev frontend image does not match Git SHA."
          }

          Write-Host "Dev frontend image: PASS"


          $backendHealthRaw = & $kubectl exec `
            -n $namespace `
            deployment/backend-deployment `
            -- wget -qO- http://127.0.0.1:8080/actuator/health

          if ($LASTEXITCODE -ne 0) {
            throw "Dev backend health request failed."
          }

          $backendHealth = $backendHealthRaw -join ""

          try {
            $backendHealthJson = $backendHealth | ConvertFrom-Json
          }
          catch {
            throw "Dev backend health response is not valid JSON."
          }

          if ($backendHealthJson.status -ne "UP") {
            throw "Dev backend health is not UP."
          }

          Write-Host "Dev backend health: PASS"


          $frontendHealthRaw = & $kubectl exec `
            -n $namespace `
            deployment/frontend-deployment `
            -- wget -qO- http://127.0.0.1/api/health

          if ($LASTEXITCODE -ne 0) {
            throw "Dev frontend -> backend health request failed."
          }

          $frontendHealth = $frontendHealthRaw -join ""

          try {
            $frontendHealthJson = $frontendHealth | ConvertFrom-Json
          }
          catch {
            throw "Dev frontend health response is not valid JSON."
          }

          if ($frontendHealthJson.status -ne "UP") {
            throw "Dev frontend -> backend health is not UP."
          }

          Write-Host "Dev frontend -> backend: PASS"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "DEV VERIFICATION: PASS"
          Write-Host "========================================"


      # ========================================================
      # DEV ROLLBACK
      # ========================================================

      - name: Automatic Dev Rollback
        if: failure() && env.DEV_DEPLOY_STARTED == 'true'
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-dev"

          Write-Host "========================================"
          Write-Host "AUTOMATIC DEV ROLLBACK"
          Write-Host "========================================"

          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_DEV_BACKEND_IMAGE)) {
            throw "Previous Dev backend image is unavailable."
          }

          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_DEV_FRONTEND_IMAGE)) {
            throw "Previous Dev frontend image is unavailable."
          }

          & $kubectl set image `
            deployment/backend-deployment `
            backend=$env:PREVIOUS_DEV_BACKEND_IMAGE `
            -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to rollback Dev backend."
          }

          & $kubectl set image `
            deployment/frontend-deployment `
            frontend=$env:PREVIOUS_DEV_FRONTEND_IMAGE `
            -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to rollback Dev frontend."
          }

          & $kubectl rollout status `
            deployment/backend-deployment `
            -n $namespace `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Dev backend rollback failed."
          }

          & $kubectl rollout status `
            deployment/frontend-deployment `
            -n $namespace `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Dev frontend rollback failed."
          }

          Write-Host "Dev automatic rollback: PASS"


  # ============================================================
  # DEPLOY PRODUCTION
  # ============================================================

  deploy-prod:
    name: Deploy Production

    runs-on:
      - self-hosted
      - docker-desktop-test

    needs:
      - deploy-dev

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    concurrency:
      group: digital-banking-production
      cancel-in-progress: false

    permissions:
      contents: read

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # KUBERNETES CONTEXT
      # ========================================================

      - name: Verify Kubernetes Context
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          Write-Host "========================================"
          Write-Host "PRODUCTION KUBERNETES CONTEXT"
          Write-Host "========================================"

          & $kubectl config current-context

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read Kubernetes context."
          }

          & $kubectl get nodes

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to access Kubernetes cluster."
          }

          Write-Host "Production Kubernetes context: PASS"


      # ========================================================
      # CAPTURE CURRENT PROD IMAGES
      # ========================================================

      - name: Capture Current Prod Images
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-prod"

          Write-Host "========================================"
          Write-Host "CAPTURE CURRENT PROD IMAGES"
          Write-Host "========================================"

          $backendImage = (
            & $kubectl get deployment backend-deployment `
              -n $namespace `
              -o jsonpath="{.spec.template.spec.containers[0].image}"
          ).Trim()

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($backendImage)) {
            throw "Failed to capture current Prod backend image."
          }

          $frontendImage = (
            & $kubectl get deployment frontend-deployment `
              -n $namespace `
              -o jsonpath="{.spec.template.spec.containers[0].image}"
          ).Trim()

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($frontendImage)) {
            throw "Failed to capture current Prod frontend image."
          }

          Write-Host ""
          Write-Host "Previous Prod backend:"
          Write-Host $backendImage

          Write-Host ""
          Write-Host "Previous Prod frontend:"
          Write-Host $frontendImage

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PREVIOUS_PROD_BACKEND_IMAGE=$backendImage"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PREVIOUS_PROD_FRONTEND_IMAGE=$frontendImage"

          Write-Host ""
          Write-Host "Previous Prod images captured: PASS"


      # ========================================================
      # CONFIGURE PROD IMAGES
      # ========================================================

      - name: Configure Prod Kustomize Images
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |

          $file = Join-Path `
            $env:GITHUB_WORKSPACE `
            "k8s\overlays\prod\kustomization.yml"

          $backendName = "ghcr.io/nutnoiz/digital-banking-api"
          $frontendName = "ghcr.io/nutnoiz/digital-banking-web"

          Write-Host "========================================"
          Write-Host "CONFIGURE PROD KUSTOMIZE IMAGES"
          Write-Host "========================================"

          if (-not (Test-Path $file)) {
            throw "Prod Kustomization file was not found."
          }

          $lines = [System.Collections.Generic.List[string]](
            [System.IO.File]::ReadAllLines($file)
          )

          if ($lines.Count -eq 0) {
            throw "Prod Kustomization file is empty."
          }


          $backendIndexes = @(
            0..($lines.Count - 1) |
            Where-Object {
              $lines[$_].Trim() -eq "- name: $backendName"
            }
          )

          if ($backendIndexes.Count -ne 1) {
            throw "Expected exactly one Prod backend image definition, found $($backendIndexes.Count)."
          }

          $backendIndex = $backendIndexes[0]

          if ($backendIndex + 1 -ge $lines.Count) {
            throw "Prod backend image definition has no following newTag line."
          }

          if ($lines[$backendIndex + 1].Trim() -notlike "newTag:*") {
            throw "Prod backend image definition is missing the expected newTag line."
          }

          $lines[$backendIndex + 1] = "    newTag: $env:GITHUB_SHA"


          $frontendIndexes = @(
            0..($lines.Count - 1) |
            Where-Object {
              $lines[$_].Trim() -eq "- name: $frontendName"
            }
          )

          if ($frontendIndexes.Count -ne 1) {
            throw "Expected exactly one Prod frontend image definition, found $($frontendIndexes.Count)."
          }

          $frontendIndex = $frontendIndexes[0]

          if ($frontendIndex + 1 -ge $lines.Count) {
            throw "Prod frontend image definition has no following newTag line."
          }

          if ($lines[$frontendIndex + 1].Trim() -notlike "newTag:*") {
            throw "Prod frontend image definition is missing the expected newTag line."
          }

          $lines[$frontendIndex + 1] = "    newTag: $env:GITHUB_SHA"


          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllLines(
            $file,
            $lines,
            $utf8NoBom
          )


          $rendered = & "C:\Program Files\Kubernetes\kubectl.exe" `
            kustomize .\k8s\overlays\prod

          if ($LASTEXITCODE -ne 0) {
            throw "Prod Kustomize rendering failed."
          }

          $renderedText = $rendered -join "`n"

          $expectedBackend = "image: $backendName`:$env:GITHUB_SHA"
          $expectedFrontend = "image: $frontendName`:$env:GITHUB_SHA"

          if ($renderedText -notmatch [regex]::Escape($expectedBackend)) {
            throw "Rendered Prod backend image does not match Git SHA."
          }

          if ($renderedText -notmatch [regex]::Escape($expectedFrontend)) {
            throw "Rendered Prod frontend image does not match Git SHA."
          }

          Write-Host "Prod Kustomize image verification: PASS"


      # ========================================================
      # DEPLOY PROD
      # ========================================================

      - name: Deploy Prod with Kustomize
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-prod"
          $changeCause = "Git commit $env:GITHUB_SHA"

          Write-Host "========================================"
          Write-Host "DEPLOY PRODUCTION"
          Write-Host "========================================"

          & $kubectl apply -k .\k8s\overlays\prod

          if ($LASTEXITCODE -ne 0) {
            throw "Prod Kustomize deployment failed."
          }

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "PROD_DEPLOY_STARTED=true"

          & $kubectl annotate `
            deployment/backend-deployment `
            -n $namespace `
            kubernetes.io/change-cause="$changeCause" `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to annotate Prod backend deployment."
          }

          & $kubectl annotate `
            deployment/frontend-deployment `
            -n $namespace `
            kubernetes.io/change-cause="$changeCause" `
            --overwrite

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to annotate Prod frontend deployment."
          }

          Write-Host "Production deployment: PASS"


      # ========================================================
      # PROD ROLLOUT
      # ========================================================

      - name: Wait for Prod Rollout
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-prod"

          & $kubectl rollout status `
            deployment/backend-deployment `
            -n $namespace `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Prod backend rollout failed."
          }

          & $kubectl rollout status `
            deployment/frontend-deployment `
            -n $namespace `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Prod frontend rollout failed."
          }

          Write-Host "Production rollout: PASS"


      # ========================================================
      # VERIFY PROD
      # ========================================================

      - name: Verify Prod Deployment
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-prod"

          $expectedBackend =
            "ghcr.io/nutnoiz/digital-banking-api:$env:GITHUB_SHA"

          $expectedFrontend =
            "ghcr.io/nutnoiz/digital-banking-web:$env:GITHUB_SHA"


          Write-Host "========================================"
          Write-Host "VERIFY PRODUCTION"
          Write-Host "========================================"


          & $kubectl get deployments -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get Prod deployments."
          }


          & $kubectl get pods -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get Prod pods."
          }


          & $kubectl get services -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to get Prod services."
          }


          $backendImage = (
            & $kubectl get deployment backend-deployment `
              -n $namespace `
              -o jsonpath="{.spec.template.spec.containers[0].image}"
          ).Trim()

          if ($backendImage -ne $expectedBackend) {
            throw "Prod backend image does not match Git SHA."
          }

          Write-Host "Prod backend image: PASS"


          $frontendImage = (
            & $kubectl get deployment frontend-deployment `
              -n $namespace `
              -o jsonpath="{.spec.template.spec.containers[0].image}"
          ).Trim()

          if ($frontendImage -ne $expectedFrontend) {
            throw "Prod frontend image does not match Git SHA."
          }

          Write-Host "Prod frontend image: PASS"


          $backendHealthRaw = & $kubectl exec `
            -n $namespace `
            deployment/backend-deployment `
            -- wget -qO- http://127.0.0.1:8080/actuator/health

          if ($LASTEXITCODE -ne 0) {
            throw "Prod backend health request failed."
          }

          $backendHealth = $backendHealthRaw -join ""

          try {
            $backendHealthJson = $backendHealth | ConvertFrom-Json
          }
          catch {
            throw "Prod backend health response is not valid JSON."
          }

          if ($backendHealthJson.status -ne "UP") {
            throw "Prod backend health is not UP."
          }

          Write-Host "Prod backend health: PASS"


          $frontendHealthRaw = & $kubectl exec `
            -n $namespace `
            deployment/frontend-deployment `
            -- wget -qO- http://127.0.0.1/api/health

          if ($LASTEXITCODE -ne 0) {
            throw "Prod frontend -> backend health request failed."
          }

          $frontendHealth = $frontendHealthRaw -join ""

          try {
            $frontendHealthJson = $frontendHealth | ConvertFrom-Json
          }
          catch {
            throw "Prod frontend health response is not valid JSON."
          }

          if ($frontendHealthJson.status -ne "UP") {
            throw "Prod frontend -> backend health is not UP."
          }

          Write-Host "Prod frontend -> backend: PASS"


          Write-Host ""
          Write-Host "========================================"
          Write-Host "PRODUCTION VERIFICATION: PASS"
          Write-Host "========================================"


      # ========================================================
      # AUTOMATIC PROD ROLLBACK
      # ========================================================

      - name: Automatic Prod Rollback
        if: failure() && env.PROD_DEPLOY_STARTED == 'true'
        shell: powershell
        run: |

          $kubectl = "C:\Program Files\Kubernetes\kubectl.exe"
          $env:KUBECONFIG = "C:\ProgramData\Kubernetes\runner-kubeconfig"

          $namespace = "digital-banking-prod"

          Write-Host "========================================"
          Write-Host "AUTOMATIC PROD ROLLBACK"
          Write-Host "========================================"

          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_PROD_BACKEND_IMAGE)) {
            throw "Previous Prod backend image is unavailable."
          }

          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_PROD_FRONTEND_IMAGE)) {
            throw "Previous Prod frontend image is unavailable."
          }


          Write-Host ""
          Write-Host "Rolling back backend..."

          & $kubectl set image `
            deployment/backend-deployment `
            backend=$env:PREVIOUS_PROD_BACKEND_IMAGE `
            -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to rollback Prod backend."
          }


          Write-Host ""
          Write-Host "Rolling back frontend..."

          & $kubectl set image `
            deployment/frontend-deployment `
            frontend=$env:PREVIOUS_PROD_FRONTEND_IMAGE `
            -n $namespace

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to rollback Prod frontend."
          }


          & $kubectl rollout status `
            deployment/backend-deployment `
            -n $namespace `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Prod backend rollback failed."
          }


          & $kubectl rollout status `
            deployment/frontend-deployment `
            -n $namespace `
            --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Prod frontend rollback failed."
          }


          Write-Host ""
          Write-Host "Checking backend health after rollback..."

          $backendHealthRaw = & $kubectl exec `
            -n $namespace `
            deployment/backend-deployment `
            -- wget -qO- http://127.0.0.1:8080/actuator/health

          if ($LASTEXITCODE -ne 0) {
            throw "Prod backend rollback health request failed."
          }

          $backendHealth = $backendHealthRaw -join ""

          try {
            $backendHealthJson = $backendHealth | ConvertFrom-Json
          }
          catch {
            throw "Prod backend rollback health response is not valid JSON."
          }

          if ($backendHealthJson.status -ne "UP") {
            throw "Prod backend health is not UP after rollback."
          }


          Write-Host ""
          Write-Host "Checking frontend -> backend after rollback..."

          $frontendHealthRaw = & $kubectl exec `
            -n $namespace `
            deployment/frontend-deployment `
            -- wget -qO- http://127.0.0.1/api/health

          if ($LASTEXITCODE -ne 0) {
            throw "Prod frontend rollback health request failed."
          }

          $frontendHealth = $frontendHealthRaw -join ""

          try {
            $frontendHealthJson = $frontendHealth | ConvertFrom-Json
          }
          catch {
            throw "Prod frontend rollback health response is not valid JSON."
          }

          if ($frontendHealthJson.status -ne "UP") {
            throw "Prod frontend -> backend health is not UP after rollback."
          }


          Write-Host ""
          Write-Host "========================================"
          Write-Host "AUTOMATIC PROD ROLLBACK: PASS"
          Write-Host "========================================"