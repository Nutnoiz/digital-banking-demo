name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/digital-banking-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test Backend
        run: ./mvnw clean verify

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend/digital-banking-api
          push: true
          tags: |
            ghcr.io/nutnoiz/digital-banking-api:latest
            ghcr.io/nutnoiz/digital-banking-api:${{ github.sha }}


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/digital-banking-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/digital-banking-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: frontend/digital-banking-web
          push: true
          tags: |
            ghcr.io/nutnoiz/digital-banking-web:latest
            ghcr.io/nutnoiz/digital-banking-web:${{ github.sha }}


  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify Kubernetes Context
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Update Backend Image
        shell: powershell
        run: |
          kubectl set image deployment/backend-deployment `
            backend=ghcr.io/nutnoiz/digital-banking-api:${{ github.sha }}

      - name: Update Frontend Image
        shell: powershell
        run: |
          kubectl set image deployment/frontend-deployment `
            frontend=ghcr.io/nutnoiz/digital-banking-web:${{ github.sha }}

      - name: Wait for Backend Rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/backend-deployment --timeout=180s

      - name: Wait for Frontend Rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/frontend-deployment --timeout=180s

      - name: Verify Deployment
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods