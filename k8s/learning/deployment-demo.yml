apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo-nginx

  template:
    metadata:
      labels:
        app: demo-nginx

    spec:
      containers:
        - name: demo-container
          image: nginx:latest
          ports:
            - containerPort: 80