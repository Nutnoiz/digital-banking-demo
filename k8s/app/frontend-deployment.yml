apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: digital-banking-frontend

  template:
    metadata:
      labels:
        app: digital-banking-frontend

    spec:
      containers:
        - name: frontend
          image: digital-banking-web:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80