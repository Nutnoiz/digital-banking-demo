<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <h1>
        Digital Banking
      </h1>

      <p>
        Secure online banking demo
      </p>

    </div>


    <div class="demo-account">

      <div class="demo-title">
        Demo Account
      </div>

      <div class="demo-row">
        <span>
          Username
        </span>

        <strong>
          demo
        </strong>
      </div>

      <div class="demo-row">
        <span>
          Password
        </span>

        <strong>
          Demo123!
        </strong>
      </div>

    </div>


    @if (errorMessage) {

      <div class="error-message">
        {{ errorMessage }}
      </div>

    }


    <form
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          autocomplete="username"
          placeholder="Enter username"
          [disabled]="loading"
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="Enter password"
          [disabled]="loading"
        />

      </div>


      <button
        type="submit"
        class="login-button"
        [disabled]="loading"
      >

        @if (loading) {

          <span>
            Signing in...
          </span>

        } @else {

          <span>
            Login
          </span>

        }

      </button>

    </form>


    <div class="login-footer">

      <p>
        Portfolio / GitHub Demo
      </p>

      <p>
        This application uses demo data for testing purposes.
      </p>

    </div>

  </div>

</div>
